name = "seosonar"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# Cloudflare KV binding for rate-limiting (10-15 scans/hr) and 20-min report caching
[[kv_namespaces]]
binding = "SEOSONAR_KV"
id = "seosonar_cache_kv_id"

[vars]
# Optional default environment variables (Override with wrangler secret put)
DEFAULT_SCAN_TIMEOUT_MS = "12000"
